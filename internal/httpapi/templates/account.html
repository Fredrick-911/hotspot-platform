<!doctype html>
<html lang="en">
<head>
{{template "head"}}
<title>My pass · {{.Tenant.Name}}</title>
</head>
<body>
<div class="wrap">
  <header class="row">
    <a class="brand grow" href="/{{.TenantQ}}">{{template "mark"}}<div><div class="brand-name">{{.Tenant.Name}}</div><div class="brand-sub">My WiFi pass</div></div></a>
    <a class="btn btn-ghost btn-sm" href="/{{.TenantQ}}">Buy a pass</a>
    <button class="btn btn-ghost btn-sm hidden" id="logout" type="button">Sign out</button>
  </header>

  <div id="banners"></div>

  <form class="card stack hidden" id="login" novalidate>
    <div><h1>See your pass</h1><p class="muted">Enter the phone number you paid with and your 4-digit PIN.</p></div>
    <div class="field-row">
      <label>Phone<input id="l-phone" type="tel" inputmode="tel" placeholder="0712 345 678" autocomplete="tel"></label>
      <label>PIN<input id="l-pin" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="1234" autocomplete="off"></label>
    </div>
    <div class="form-msg" id="l-msg" role="alert"></div>
    <button class="btn" type="submit" id="l-go">Show my pass</button>
  </form>

  <div id="pass" class="stack hidden"></div>
  <div id="loading" class="card"><div class="skeleton"></div></div>
  <p class="footer">Powered by Hotspot Platform</p>
</div>
<script src="/static/js/core.js"></script>
<script src="/static/js/account.js"></script>
</body>
</html>
